syntax = "proto3";

package ycc.v1;

option go_package = "github.com/whyrusleeping/ycc/proto/ycc/v1;yccv1";

// Event mirrors internal/event.Event. Data is carried as a JSON string so the
// heterogeneous per-type payload needs no proto schema churn (and matches the
// on-disk JSONL exactly).
message Event {
  int64 seq = 1;
  string ts = 2; // RFC3339
  string actor = 3;
  string type = 4;
  string data_json = 5;
  bool transient = 6; // broadcast-only, never persisted; seq is 0
}

message StartSessionRequest {
  string workspace = 1; // workspace dir; empty => resolve project
  string mode = 2; // session mode, e.g. "work"
  reserved 3; // retired session-policy field
  string prompt = 4; // initial task prompt
  // project is an optional registered project name; when set it resolves to that
  // project's workspace (overriding `workspace`).
  string project = 5;
  // coordinator_model optionally overrides the coordinator's logical model
  // (a name from ListModels) FOR THIS SESSION ONLY — the persisted per-role
  // defaults in ycc.toml are untouched, and implementer/reviewers keep them.
  // Empty means "use the configured default". Unknown name => InvalidArgument.
  string coordinator_model = 6;
  // images optionally attaches up to four validated pictures to the OPENING
  // prompt (same limits and validation as SendInputRequest.images), so a
  // session whose whole subject is a screenshot does not have to waste its
  // first turn.
  repeated ImageAttachment images = 7;
  // preset identifies the opening-prompt preset selected by the client. The
  // daemon uses it to apply an optional roles.presets model binding for this
  // session only; empty or unbound means the configured coordinator default.
  string preset = 8;
}
message StartSessionResponse { string session_id = 1; }

// Projects — persistent multi-project daemon. A project is a named
// workspace; the daemon's registry maps name -> path in its state dir.
message ProjectInfo {
  string name = 1;
  string path = 2;
  GitStatus git = 3;
}
message GitStatus {
  string branch = 1;         // "" when detached
  bool has_upstream = 2;
  int32 ahead = 3;
  int32 behind = 4;
  bool dirty = 5;
  int64 last_fetch_unix = 6; // 0 = poller has not fetched successfully yet
  string fetch_error = 7;    // last fetch failure; "" when ok
}
message ListProjectsRequest {}
message ListProjectsResponse { repeated ProjectInfo projects = 1; }
message AddProjectRequest {
  string path = 1; // workspace dir to register
  string name = 2; // optional; derived from the dir basename when empty
}
message AddProjectResponse { ProjectInfo project = 1; }
message RemoveProjectRequest { string name = 1; }
message RemoveProjectResponse {}
message RenameProjectRequest {
  string name = 1;     // current registered name
  string new_name = 2; // desired name; must not collide with another project
}
message RenameProjectResponse { ProjectInfo project = 1; }

// ListDir — remote directory browsing for the add-project flow.
// Lists DIRECTORIES ONLY (never files or file contents) so a remote client can
// navigate the daemon host's filesystem to pick a workspace to register with
// AddProject. Note the bearer token already permits StartSession in an
// arbitrary workspace path, so listing directory names does not expand the
// trust surface.
message DirEntry {
  string name = 1;          // directory basename
  bool is_git_repo = 2;     // contains a .git entry
  bool is_registered = 3;   // path is an already-registered project
}
message ListDirRequest {
  // Absolute directory to list; empty => the daemon user's home directory.
  string path = 1;
  // When true, also populate `suggestions`: git repos that are siblings of
  // already-registered projects (likely projects, one tap to register).
  bool suggest = 2;
}
message ListDirResponse {
  string path = 1;                 // resolved absolute path that was listed
  string parent = 2;               // parent dir ("" when path is the root)
  repeated DirEntry entries = 3;   // subdirectories, sorted, hidden dirs omitted
  repeated string suggestions = 4; // absolute paths (only when suggest=true)
}

message SubscribeRequest {
  string session_id = 1;
  int64 from_seq = 2; // replay events with seq > from_seq, then stream live
}

// ImageAttachment is an inline picture accompanying a user message. The daemon
// validates both the declared media type and file signature before passing it to
// the model. Attachment bytes are request-only: event logs retain metadata, not
// the image payload.
message ImageAttachment {
  bytes data = 1;
  string media_type = 2; // image/jpeg | image/png | image/gif | image/webp
  string filename = 3;   // optional display name; never interpreted as a path
}

message SendInputRequest {
  string session_id = 1;
  string text = 2;
  repeated ImageAttachment images = 3;
}
message SendInputResponse {}

message AnswerQuestionRequest {
  string session_id = 1;
  string text = 2;
  // option_index selects a suggested option from the question's options list
  // (0-based) when >= 0; otherwise text is taken as a free-text answer.
  int32 option_index = 3;
}
message AnswerQuestionResponse {}

// QuestionAnswer is one answer in a batch reply to a multi-question ask_user
// call. option_index selects a suggested option from that question's options
// list (0-based) when >= 0; otherwise text is taken as a free-text answer.
message QuestionAnswer {
  string text = 1;
  int32 option_index = 2;
}

// AnswerQuestions replies to a batch of questions posed in a single ask_user
// call. The answers are positional: answers[i] answers the i-th question.
message AnswerQuestionsRequest {
  string session_id = 1;
  repeated QuestionAnswer answers = 2;
}
message AnswerQuestionsResponse {}

// Interrupt requests a graceful pause-to-steer of a running session. It pauses
// at the next safe checkpoint without aborting a tool.
message InterruptRequest { string session_id = 1; }
message InterruptResponse {}
// Resume continues a paused session (optionally after SendInput corrections).
message ResumeRequest { string session_id = 1; }
message ResumeResponse {}
// StopSession hard-terminates a session: it cancels the agent loop,
// closes the event log, and removes the session from the daemon. Distinct from
// Interrupt's graceful pause/steer — there is no resume.
message StopSessionRequest { string session_id = 1; }
message StopSessionResponse {}
// ResumeSession re-opens a persisted (finished/idle) session on its EXISTING
// event log ("resume = replay"): its coordinator is
// re-instantiated with history reconstructed from the log and new activity
// appends to the same continuous events.jsonl. Idempotent if already live.
message ResumeSessionRequest {
  string session_id = 1;
  string project = 2;
}
message ResumeSessionResponse {
  string session_id = 1;
  string mode = 2;
  string status = 3;
  string workspace = 4;
}

message ListModesRequest {}
message Mode {
  string name = 1;
  string title = 2;
  string description = 3;
}
// Preset is a home-menu entry that starts a session in `mode` with a tailored
// `opening_prompt`. The pm mode exposes spec/backlog/feature/bug framings this
// way: one mode with four opening prompts.
message Preset {
  string name = 1;        // menu key, distinct from the mode
  string title = 2;
  string description = 3;
  string mode = 4;        // session mode to start (e.g. "pm")
  string opening_prompt = 5; // verbatim first prompt seeded into the session
}
message ListModesResponse {
  repeated Mode modes = 1;
  repeated Preset presets = 2;
}

message ListSessionsRequest {
  string project = 1; // optional: filter to sessions in this project's workspace
}
message SessionInfo {
  string session_id = 1;
  string mode = 2;
  string status = 3; // running | idle | error
  string workspace = 4;
}
message ListSessionsResponse { repeated SessionInfo sessions = 1; }

message ListSessionHistoryRequest {
  string project = 1; // registered project; empty allowed only when exactly one exists
}
message SessionSummary {
  string session_id = 1;
  string mode = 2;
  string status = 3;        // running | idle | error | paused | stopped
  string workspace = 4;
  string title = 5;         // derived from the first user prompt
  string started_at = 6;    // RFC3339
  string last_activity = 7; // RFC3339
  repeated string focus_tasks = 8;
  int64 turns = 9;
  int64 tool_calls = 10;
  bool live = 11;
  // waiting_input is true when a live session is blocked on an unanswered
  // ask_user question (single or batch) and needs the user to reply. Only ever
  // set on live rows — a persisted-only session holds no in-memory question.
  bool waiting_input = 12;
}
message ListSessionHistoryResponse { repeated SessionSummary sessions = 1; }

// GetSessionTranscript returns the full event log for a session — live or
// persisted on disk — so the session browser can render a read-only replayed
// transcript with the same event components as the live view.
message GetSessionTranscriptRequest {
  string project = 1;    // registered project; empty allowed only when exactly one exists
  string session_id = 2;
}
message GetSessionTranscriptResponse { repeated Event events = 1; }

// GetCommitDiff returns the `git show` output (stat + patch) for a commit, so the
// transcript can drill into what an agent actually committed. The
// daemon caps the returned diff to bound the wire payload; truncated reports when
// the cap was hit so the client can render a truncation notice.
message GetCommitDiffRequest {
  string project = 1; // registered project; empty allowed only when exactly one exists
  string sha = 2;     // bare hex commit sha (from a commit_made event)
}
message GetCommitDiffResponse {
  string diff = 1;
  bool truncated = 2;
}

// ListModels enumerates the configured logical models so the settings
// overlay can populate the per-role pickers.
message ListModelsRequest {}
message ModelInfo {
  string name = 1;    // logical name (e.g. "claude", "gpt")
  string backend = 2; // anthropic | openai | ollama | ...
  string model = 3;   // backend model id
  // Per-model pricing ($/Mtok) surfaced so the live session status bar can price
  // running usage. The price_* fields are optional so an unset rate
  // is distinguishable from an explicit 0.0; priced reports whether ANY rate is
  // configured (mirrors config.Pricing.Configured) so unpriced models render
  // tokens-only without inventing a cost.
  optional double price_input = 4;
  optional double price_output = 5;
  optional double price_cache_read = 6;
  optional double price_cache_write = 7;
  bool priced = 8;
}
message ListModelsResponse {
  repeated ModelInfo models = 1;
  // Current default per-role assignment (config.Roles) so the settings overlay can
  // seed its per-role pickers with the ACTUAL current selection — even when opened
  // from the home menu with no live session.
  string coordinator = 2;
  string implementer = 3;
  repeated string reviewers = 4;
  // Resolved thinking level of each role's currently assigned model (reviewers
  // use the first model), so the overlay seeds its role-row controls accurately.
  string coordinator_thinking = 5;
  string implementer_thinking = 6;
  string reviewers_thinking = 7;
  // Effective work-mode implementation strategy (work.implementation), resolved
  // to "delegate" when unset, so settings clients show the real current default.
  string work_implementation = 8;
}

// ModelConfig mirrors a [models.X] block for the settings
// overlay's add/edit/remove of model backends. Keys are referenced via key_env
// only — no secret values cross the wire. The pricing fields are optional so an
// unset price is distinguishable from an explicit 0.0.
message ModelConfig {
  string name = 1;             // logical name (e.g. "claude", "gpt")
  string backend = 2;          // anthropic | openai | openai-compatible | glm | ollama
  string base_url = 3;
  string model = 4;            // backend model id
  string key_env = 5;          // env var holding the API key (never the key itself)
  string thinking = 6;         // adaptive | off | ""
  string effort = 7;           // low | medium | high | xhigh | max
  string thinking_display = 8; // summarized | omitted
  optional double price_input = 9;
  optional double price_output = 10;
  optional double price_cache_read = 11;
  optional double price_cache_write = 12;
  string auth = 13;            // credential mechanism: "" | "api-key" | "oauth"
}

// UpsertModel adds or replaces a logical model backend. The change
// takes effect on the next turn/spawn; persist=true also writes ycc.toml.
message UpsertModelRequest {
  ModelConfig model = 1;
  bool persist = 2;
}
message UpsertModelResponse {}

// RemoveModel deletes a logical model backend. Rejected if a role still
// references it. persist=true also writes ycc.toml.
message RemoveModelRequest {
  string name = 1;
  bool persist = 2;
}
message RemoveModelResponse {}

// GetModelConfig returns a model backend's full record for editing.
message GetModelConfigRequest { string name = 1; }
message GetModelConfigResponse { ModelConfig model = 1; }

// DiscoverModels lists the model ids available from a backend connection so the
// connection form can offer them for selection. base_url + key_env
// describe the connection to probe (the key value never crosses the wire — the
// daemon resolves key_env locally). On a discovery failure the daemon falls back
// to curated defaults and sets from_network=false with a human-readable note.
message DiscoverModelsRequest {
  string backend = 1;  // anthropic | openai | openai-compatible | glm | ollama
  string base_url = 2;
  string key_env = 3;  // env var holding the API key (never the key itself)
}
message DiscoverModelsResponse {
  repeated string model_ids = 1;
  bool from_network = 2; // true => queried the backend; false => curated fallback
  string note = 3;       // human-readable status/error (e.g. why fallback happened)
}


// SetRoleConfig reassigns per-role logical models. Empty
// coordinator/implementer leaves that role unchanged; an empty reviewers list
// leaves reviewers unchanged. The assignment is persisted as the default (roles
// in ycc.toml) so it survives a restart. When session_id names a live session the
// change also applies to it immediately; an empty/unknown session_id just updates
// the persisted default (e.g. changed from the home menu with no session).
message SetRoleConfigRequest {
  string session_id = 1;
  string coordinator = 2;
  string implementer = 3;
  repeated string reviewers = 4;
}
message SetRoleConfigResponse {}

// SetThinking maps role to its currently assigned model(s) and stores the level
// in each model's [models.X] config (empty role = all assigned models, deduped;
// reviewers = every reviewer model). When session_id names a live session the
// change also applies immediately; an empty/unknown session_id resolves the
// default role assignments. Levels: off | low | medium | high | xhigh | max.
message SetThinkingRequest {
  string session_id = 1;
  string level = 2; // off | low | medium | high | xhigh | max
  string role = 3;  // empty = all roles; coordinator | implementer | reviewers
}
message SetThinkingResponse {}

// SetWorkImplementation changes the persisted work-mode implementation strategy.
// The coordinator toolset and system prompt are fixed when a session starts, so
// this setting applies to the next session rather than rebuilding a live loop.
message SetWorkImplementationRequest {
  string implementation = 1; // delegate | direct
}
message SetWorkImplementationResponse {}

// Review tiers: list/edit the named review-intensity tiers and the
// default tier. Tiers are stored under [reviews] in ycc.toml; the built-in
// simple/single-opus/high-powered tiers always exist and may be overridden by a
// same-named configured tier.

// ReviewerSlot is one reviewer slot of a tier's long form
// ([[reviews.tiers.X.reviewers]]): which logical model reviews, under which
// label, with what focus prompt and optional per-reviewer thinking level.
message ReviewerSlot {
  string name = 1;     // label; empty defaults to model
  string model = 2;    // logical model name (required)
  string prompt = 3;   // extra focus guidance for this reviewer
  string thinking = 4; // "" = model default; off | low | medium | high | xhigh | max
}

// ReviewTierInfo mirrors a [reviews.tiers.X] block plus derived flags. The
// models shorthand and the reviewers long form are mutually exclusive (setting
// both is rejected, matching config validation).
message ReviewTierInfo {
  string name = 1;                    // tier name (map key in ycc.toml)
  string strategy = 2;                // "" | "agents" | "coordinator" (aliases self/self-review)
  string description = 3;             // "when to pick me" guidance shown to the coordinator
  string prompt = 4;                  // extra guidance prepended to EVERY reviewer of the tier
  repeated string models = 5;         // shorthand: one generic reviewer per logical model
  repeated ReviewerSlot reviewers = 6;// long form: one slot per reviewer
  bool builtin = 7;                   // one of the always-present tiers (simple/single-opus/high-powered)
  bool configured = 8;                // has an explicit [reviews.tiers.X] entry (custom tier or built-in override)
}

// ListReviewTiers returns the EFFECTIVE tiers (built-ins overlaid with the
// configured entries) plus the effective default tier name, so a client can
// render exactly what spawn_reviewers would resolve.
message ListReviewTiersRequest {}
message ListReviewTiersResponse {
  repeated ReviewTierInfo tiers = 1; // sorted by name
  string default_tier = 2;           // effective default (reviews.default, or "single-opus")
}

// UpsertReviewTier adds or replaces the configured tier named tier.name and
// persists it to ycc.toml. Validated like config load (unknown strategy/model/
// thinking level, or models+reviewers both set, are invalid_argument). Takes
// effect on the next spawn_reviewers (tiers resolve per call).
message UpsertReviewTierRequest { ReviewTierInfo tier = 1; }
message UpsertReviewTierResponse {}

// RemoveReviewTier deletes the CONFIGURED entry for a tier and persists. A
// built-in name reverts to its built-in behaviour; a custom tier disappears.
// Rejected when reviews.default names the removed custom tier (change the
// default first) or when the tier has no configured entry.
message RemoveReviewTierRequest { string name = 1; }
message RemoveReviewTierResponse {}

// SetReviewDefault sets reviews.default (persisted). The tier must exist among
// the effective tiers; an empty name clears the setting (falling back to
// single-opus).
message SetReviewDefaultRequest { string name = 1; }
message SetReviewDefaultResponse {}

// Backlog browser: read-only RPCs that expose the durable backlog
// (internal/docs Store) so clients can list and inspect tasks independent of any
// agent session.
message ListBacklogRequest {
  string project = 1; // registered project; empty allowed only when exactly one exists
}
message BacklogTaskSummary {
  string id = 1;
  string title = 2;
  string status = 3;
  int32 priority = 4;
  repeated string depends_on = 5;
  bool ready = 6;              // true when no dependency is blocking
  repeated string blocked_by = 7; // ids of not-yet-done dependencies
}
message ListBacklogResponse { repeated BacklogTaskSummary tasks = 1; }
message GetTaskRequest {
  string project = 1; // registered project; empty allowed only when exactly one exists
  string id = 2;
}
message TaskDetail {
  string id = 1;
  string title = 2;
  string status = 3;
  int32 priority = 4;
  repeated string depends_on = 5;
  repeated string spec_refs = 6;
  string created = 7;
  string updated = 8;
  string body = 9; // markdown: description, acceptance criteria, work log
  bool ready = 10;
  repeated string blocked_by = 11;
  string path = 12; // absolute task file path; lets a local client open it in $EDITOR
}
message GetTaskResponse { TaskDetail task = 1; }

// Backlog grooming: direct mutation of a task from the
// browser. Unset optional fields are left untouched; a request with NO mutation
// fields set is a valid "refresh" that re-reads the task file (used after
// hand-edits in $EDITOR).
message UpdateTaskRequest {
  string project = 1;       // registered project; empty allowed only when exactly one exists
  string id = 2;
  optional string status = 3;   // todo | in_progress | in_review | done | blocked
  optional int32 priority = 4;  // 1..5
  optional string title = 5;
}
message UpdateTaskResponse { TaskDetail task = 1; }

// CreateTask adds a new task to the backlog. It mirrors the
// docs.Store.Create path used by the capture agent, composing the canonical
// "## Description / ## Acceptance criteria / ## Work log" scaffold around the
// supplied body. Used by `ycc task add` when a daemon is available.
message CreateTaskRequest {
  string project = 1;          // registered project; empty allowed only when exactly one exists
  string title = 2;            // required
  string body = 3;            // long description / markdown; scaffolded if it lacks the canonical headers
  int32 priority = 4;         // 1..5; 0 => default (3)
  repeated string depends_on = 5;
  repeated string spec_refs = 6;
}
message CreateTaskResponse { TaskDetail task = 1; }

// Plan library (reusable runbooks): read-only access to the
// in-repo plans/*.md so clients can browse and view saved plans.
message ListPlansRequest { string project = 1; }
message PlanSummary {
  string name = 1;  // file name without .md (the invocation key)
  string title = 2; // first markdown heading, else name
  string path = 3;  // absolute path
}
message ListPlansResponse { repeated PlanSummary plans = 1; }
message GetPlanRequest {
  string project = 1;
  string name = 2;
}
message GetPlanResponse {
  string name = 1;
  string title = 2;
  string content = 3;
}

// Project memory: read-only access to memory.md — the advisory
// operational notes agents record across sessions — so clients can view what
// the agents have learned about working on the project.
message GetMemoryRequest {
  string project = 1; // registered project; empty allowed only when exactly one exists
}
message GetMemoryResponse {
  string content = 1; // full markdown; "" when memory.md does not exist yet
  string path = 2;    // absolute path to memory.md
}

// Quick-add backlog capture: a TUI overlay lets the user
// quick-add a backlog item mid-session WITHOUT disturbing the running session.
// The daemon runs a lightweight, off-stream capture agent that turns the
// description into a structured task via create_task. The agent may ask ONE
// clarifying question; the client carries it back via prior_question/prior_answer
// so the second call creates the task without asking again.
message CaptureBacklogItemRequest {
  string project = 1;        // registered project; empty allowed only when exactly one exists
  string description = 2;    // the user's natural-language description
  string prior_question = 3; // the clarifying question the agent asked previously (if any)
  string prior_answer = 4;   // the user's answer to that question
}

// Usage/cost breakdown: the daemon scans a workspace's
// session event logs, joins per-turn usage with task focus and per-model
// pricing, and returns a structured breakdown grouped by task × model × day so
// non-CLI clients (TUI/phone) can render it identically to `ycc cost`.
message GetUsageRequest {
  string project = 1;           // registered project; empty allowed only when exactly one exists
  repeated string group_by = 2; // task | model | session | agent | day (default: task)
  string since = 3;             // YYYY-MM-DD inclusive, optional
  string until = 4;             // YYYY-MM-DD inclusive, optional
  string task = 5;              // restrict to one backlog task id, optional; empty = no filter
}
message UsageRow {
  string task = 1;
  string model = 2;
  string session = 3;
  string day = 4;
  int64 input = 5;
  int64 output = 6;
  int64 cache_read = 7;
  int64 cache_write = 8;
  int64 total = 9;
  double cost = 10;
  string price_status = 11; // priced | unpriced | partial
  string agent = 12;        // coordinator | implementer | reviewer (collapsed role)
}
message GetUsageResponse {
  repeated UsageRow rows = 1;
  UsageRow total = 2;
  string workspace = 3;
}

// Provider-side subscription allowance. This is intentionally
// separate from GetUsage: it is shared account quota, not ycc-local token spend.
// No credential material crosses this boundary.
message GetSubscriptionUsageRequest {
  bool refresh = 1; // request refresh when cache policy permits; never bypasses throttling
}
message SubscriptionUsageWindow {
  string id = 1;              // provider-stable bucket id when available
  string label = 2;           // human-facing scope/window label
  double used_percent = 3;    // consumed percentage, clamped to 0..100
  int64 resets_at_unix = 4;   // UTC Unix seconds; 0 when provider omits it
  int64 window_seconds = 5;   // nominal duration; 0 when provider omits it
}
message SubscriptionUsageAccount {
  string provider = 1;        // anthropic | openai
  string plan = 2;            // provider plan label when reported
  repeated string models = 3; // configured logical models sharing this account
  repeated SubscriptionUsageWindow windows = 4;
  string state = 5;           // fresh | stale | unavailable
  int64 fetched_at_unix = 6;
  string message = 7;         // sanitized availability/freshness note
}
message GetSubscriptionUsageResponse {
  repeated SubscriptionUsageAccount accounts = 1;
}

// Spend guard budget caps. GetBudget returns the
// configured session and loop caps so the TUI work-loop driver can enforce the
// per-loop-run cap client-side (session caps are enforced daemon-side). Every
// field is 0 when unset (unlimited); a cost cap is in US dollars, a token cap
// counts total tokens.
message GetBudgetRequest {}
message GetBudgetResponse {
  double session_cost = 1;  // $ cap per session (0 = unlimited)
  int64 session_tokens = 2; // total-token cap per session (0 = unlimited)
  double loop_cost = 3;     // $ cap per work-loop run (0 = unlimited)
  int64 loop_tokens = 4;    // total-token cap per work-loop run (0 = unlimited)
}

// Notify routes a client-originated push notification through the daemon-side
// notifier. It exists so the client-driven work-loop can emit its
// completion digest via the same best-effort webhook channel the daemon uses for
// question/idle/error/blocked events. delivered is false when the daemon has no
// notifier configured or the kind is muted.
message NotifyRequest {
  string kind = 1;       // one of: question, idle, error, digest, blocked
  string line = 2;       // short human line
  string project = 3;    // project label
  string session_id = 4; // originating session id (optional)
}
message NotifyResponse { bool delivered = 1; }

// The daemon-owned unattended backlog drain starts fresh `work` sessions one
// after another, enforces the no-progress guard and per-loop budget caps, and
// accumulates the end-of-batch digest. It survives client disconnects and clients
// observe it through GetWorkLoop plus Subscribe on current_session_id.

// WorkLoopDigestTask is one task row in a finished loop's batch digest, mirroring
// the client digest surface: how the task changed plus its rolled-up commit sha,
// review verdict tally, tokens, priced cost, and (for blocked tasks) the reason.
message WorkLoopDigestTask {
  string id = 1;
  string title = 2;
  string status = 3;
  string sha = 4;           // commit sha recorded for the task (if any)
  string verdict_tally = 5; // e.g. "approve×2 reject×1"
  int64 tokens = 6;
  double cost = 7;
  string price_status = 8; // priced | unpriced | partial
  string reason = 9;       // blocked reason (from the task work log), blocked tasks only
}

// WorkLoopSession is a per-session record captured as each loop session finishes:
// its id, the backlog task it focused, and its summed tokens/priced cost.
message WorkLoopSession {
  string session_id = 1;
  string focus = 2;
  int64 tokens = 3;
  double cost = 4;
  string price_status = 5; // priced | unpriced | partial
  int64 duration_secs = 6; // wall-clock seconds the session took
}

// WorkLoopInfo is a snapshot of a work loop: its lifecycle state, the session it
// is currently driving (Subscribe target), and — once finished — the rolled-up
// batch digest classifying every task against the backlog baseline at loop start.
message WorkLoopInfo {
  string loop_id = 1;
  string project = 2;
  string state = 3;              // running | waiting | stopping | finished
  string current_session_id = 4; // the session being driven now (Subscribe target); empty between sessions
  string outcome = 5;            // human outcome line once finished
  string started_at = 6;         // RFC3339
  int32 sessions_run = 7;
  repeated WorkLoopSession sessions = 8;
  repeated WorkLoopDigestTask completed = 9;
  repeated WorkLoopDigestTask blocked = 10;
  repeated WorkLoopDigestTask in_review = 11;
  repeated WorkLoopDigestTask created = 12;
  int64 total_tokens = 13;
  double total_cost = 14;
  string cost_status = 15; // priced | unpriced | partial
  string resume_at = 16;   // RFC3339; empty unless waiting
  string wait_kind = 17;   // provider failure kind; empty unless waiting
}

// StartWorkLoop starts an unattended work loop for a project. It fails
// (FailedPrecondition) if a loop is already running/waiting/stopping for that workspace.
message StartWorkLoopRequest { string project = 1; }
message StartWorkLoopResponse { WorkLoopInfo loop = 1; }

// StopWorkLoop gracefully stops a live loop: the current session finishes and no
// next session is picked, or a provider wait wakes immediately. Returns the loop
// snapshot (unset when none running).
message StopWorkLoopRequest { string project = 1; }
message StopWorkLoopResponse { WorkLoopInfo loop = 1; }

// GetWorkLoop returns the current loop snapshot for a project so a reconnecting
// client can observe state (and Subscribe to current_session_id). loop is unset
// when no loop has run for the workspace.
message GetWorkLoopRequest { string project = 1; }
message GetWorkLoopResponse { WorkLoopInfo loop = 1; }

// A parallel workstream
// is a linked git worktree + branch plus the `work` session scoped to it, tracked
// as a child of a project. WorkstreamInfo mirrors workstream.Workstream.
message WorkstreamInfo {
  string id = 1;            // stable short id (ws_<8-hex>)
  string project = 2;       // parent project NAME
  string base_commit = 3;   // commit the branch was created from
  string branch = 4;        // worktree branch ref (ycc/ws/<id>[-<task>])
  string worktree_path = 5; // absolute worktree directory
  string session_id = 6;    // session scoped to the worktree (Subscribe target)
  string task_id = 7;       // optional backlog task this workstream targets
  string status = 8;        // active | ready | needs_attention | merged | discarded | stale
  string created_at = 9;    // RFC3339
  int64 commit_count = 10;  // commits on the branch since base_commit (0 if unknown)
  string session_status = 11; // live session status: running|idle|paused|stopped|error (empty if unknown)
  string base_branch = 12;    // local branch advanced when this workstream integrates
  string status_reason = 13;  // why this workstream needs attention (empty otherwise)
  string integrate_session_id = 14; // latest integrate-recovery session (Subscribe target)
  string integration_state = 15; // live queue state: queued | integrating (empty otherwise)
  string integration_mode = 16; // effective project mode: manual | gate | auto
}

// SpawnWorkstream creates a worktree + branch off the project's base and starts a
// `work` session inside it. The session_id for Subscribe rides
// inside the returned WorkstreamInfo.
message SpawnWorkstreamRequest {
  string project = 1;           // parent project name (required)
  string base_ref = 2;          // ref/commit to branch from; empty => HEAD
  string task_id = 3;           // optional backlog task id (appended to branch)
  string prompt = 4;            // optional initial prompt for the session
  reserved 5;                   // retired session-policy field
}
message SpawnWorkstreamResponse { WorkstreamInfo workstream = 1; }

// ListWorkstreams returns the workstreams for a project (empty project => all).
message ListWorkstreamsRequest { string project = 1; }
message ListWorkstreamsResponse { repeated WorkstreamInfo workstreams = 1; }

// PreviewMerge trial-merges a workstream's branch into its project's current base
// WITHOUT mutating anything: clean reports whether the merge
// applies without conflict, conflicts lists the conflicted paths otherwise, and
// diff holds the integrated diff preview when clean.
message PreviewMergeRequest { string workstream_id = 1; }
message PreviewMergeResponse {
  bool clean = 1;
  repeated string conflicts = 2;
  string diff = 3;
}

// MergeWorkstream integrates a workstream's branch back to base through an
// explicit accept gate. A clean trial merge returns needs_accept and the
// integrated diff without mutating the base until accept=true. A conflict returns
// the conflicted paths with the base untouched and the worktree kept.
message MergeWorkstreamRequest {
  string workstream_id = 1;
  bool accept = 2; // accept a review-gated clean merge
}
message MergeWorkstreamResponse {
  bool merged = 1;            // branch integrated (commit holds the merge sha)
  string commit = 2;
  bool needs_accept = 3;      // clean but gated: review diff, then re-call accept=true
  string diff = 4;            // integrated diff when needs_accept
  repeated string conflicts = 5; // conflicted paths when the merge conflicted
}

// DiscardWorkstream abandons a workstream without merging: it stops the session,
// cleans up the worktree + branch, and marks the registry entry discarded.
message DiscardWorkstreamRequest { string workstream_id = 1; }
message DiscardWorkstreamResponse {}

// RetryIntegration re-queues a ready or needs-attention workstream for automatic
// integration. Repeated calls while
// already queued are idempotent.
message RetryIntegrationRequest { string workstream_id = 1; }
message RetryIntegrationResponse { WorkstreamInfo workstream = 1; }

service SessionService {
  rpc ListModes(ListModesRequest) returns (ListModesResponse);
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // ListSessionHistory enumerates all sessions for a project (live + persisted
  // on-disk logs), most-recent first. ListSessions stays live-only.
  rpc ListSessionHistory(ListSessionHistoryRequest) returns (ListSessionHistoryResponse);
  // GetSessionTranscript returns a session's full event log (live or persisted)
  // for the read-only transcript drill-in.
  rpc GetSessionTranscript(GetSessionTranscriptRequest) returns (GetSessionTranscriptResponse);
  // GetCommitDiff returns a commit's `git show` diff so the transcript can drill
  // into what an agent committed from a commit_made row.
  rpc GetCommitDiff(GetCommitDiffRequest) returns (GetCommitDiffResponse);
  rpc Subscribe(SubscribeRequest) returns (stream Event);
  rpc SendInput(SendInputRequest) returns (SendInputResponse);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  // AnswerQuestions replies to a batch of questions posed in one ask_user call.
  rpc AnswerQuestions(AnswerQuestionsRequest) returns (AnswerQuestionsResponse);

  // Interrupt & steer: gracefully pause a running session at its
  // next safe checkpoint, then continue the same loop (optionally after a
  // steered SendInput correction). Distinct from the hard Stop/terminate.
  rpc Interrupt(InterruptRequest) returns (InterruptResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);

  // StopSession hard-terminates a session: cancels its agent loop, closes its
  // event log, and removes it from the daemon (no resume). Distinct from
  // Interrupt's graceful pause.
  rpc StopSession(StopSessionRequest) returns (StopSessionResponse);

  // ResumeSession re-opens a persisted session on its existing event log
  // (reconstructs loop history; "resume = replay"). Idempotent
  // if the session is already live.
  rpc ResumeSession(ResumeSessionRequest) returns (ResumeSessionResponse);

  // Projects — persistent multi-project daemon.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc AddProject(AddProjectRequest) returns (AddProjectResponse);
  rpc RemoveProject(RemoveProjectRequest) returns (RemoveProjectResponse);
  rpc RenameProject(RenameProjectRequest) returns (RenameProjectResponse);
  // ListDir lists subdirectories of a daemon-host path (directories only) so
  // remote clients can browse to a workspace for AddProject.
  rpc ListDir(ListDirRequest) returns (ListDirResponse);

  // Settings overlay: enumerate models and change per-role model
  // assignment mid-flight.
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc SetRoleConfig(SetRoleConfigRequest) returns (SetRoleConfigResponse);
  rpc SetThinking(SetThinkingRequest) returns (SetThinkingResponse);
  rpc SetWorkImplementation(SetWorkImplementationRequest) returns (SetWorkImplementationResponse);

  // Model backends: add/edit/remove a logical model backend at
  // runtime; optionally persisted to ycc.toml.
  rpc UpsertModel(UpsertModelRequest) returns (UpsertModelResponse);
  rpc RemoveModel(RemoveModelRequest) returns (RemoveModelResponse);
  rpc GetModelConfig(GetModelConfigRequest) returns (GetModelConfigResponse);
  rpc DiscoverModels(DiscoverModelsRequest) returns (DiscoverModelsResponse);

  // Review tiers: list the effective tiers and edit the configured
  // ones (plus the default tier) at runtime; always persisted to ycc.toml.
  rpc ListReviewTiers(ListReviewTiersRequest) returns (ListReviewTiersResponse);
  rpc UpsertReviewTier(UpsertReviewTierRequest) returns (UpsertReviewTierResponse);
  rpc RemoveReviewTier(RemoveReviewTierRequest) returns (RemoveReviewTierResponse);
  rpc SetReviewDefault(SetReviewDefaultRequest) returns (SetReviewDefaultResponse);

  // Backlog browser: read-only access to the durable backlog.
  rpc ListBacklog(ListBacklogRequest) returns (ListBacklogResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  // UpdateTask grooms a backlog task in place: change
  // status/priority/title, or (no mutation fields) refresh + regenerate the index.
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  // CreateTask adds a new task to the backlog: compose the canonical
  // task scaffold around a description and assign the next id. Used by
  // `ycc task add` when a daemon is available.
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  // Plan library (reusable runbooks): read-only access to the
  // in-repo plans/*.md so clients can browse and view saved plans.
  rpc ListPlans(ListPlansRequest) returns (ListPlansResponse);
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse);
  // Project memory: read-only view of memory.md, the agents'
  // advisory operational notes for the project.
  rpc GetMemory(GetMemoryRequest) returns (GetMemoryResponse);

  // Quick-add backlog capture: run a lightweight,
  // off-stream capture agent that turns a natural-language description into a
  // backlog task without disturbing the running session. May ask ONE clarifying
  // question, carried back via prior_question/prior_answer.
  //
  // Streams the capture agent's action log (the same Event stream as Subscribe)
  // so the client can show live progress, ending with a terminal
  // `capture_result` event whose data_json carries {task_id,title,question} on
  // success (or {error} on failure).
  rpc CaptureBacklogItem(CaptureBacklogItemRequest) returns (stream Event);

  // Usage/cost breakdown: aggregated, priced token usage by task ×
  // model × day so clients can render the cost breakdown.
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse);
  // Best-effort provider-side subscription allowance.
  rpc GetSubscriptionUsage(GetSubscriptionUsageRequest) returns (GetSubscriptionUsageResponse);

  // Spend guard: return the configured budget caps so the
  // TUI work-loop driver can enforce the per-loop-run cap client-side.
  rpc GetBudget(GetBudgetRequest) returns (GetBudgetResponse);

  // Push notifications: route a client-originated notification (the
  // work-loop completion digest) through the daemon-side webhook notifier.
  rpc Notify(NotifyRequest) returns (NotifyResponse);

  // Daemon-side work loop: start/stop/observe the
  // unattended backlog-drain loop. The loop lives in the daemon, so it survives
  // client disconnects; any client can start it, poll GetWorkLoop for state +
  // digest, Subscribe to the current session, and gracefully StopWorkLoop it.
  rpc StartWorkLoop(StartWorkLoopRequest) returns (StartWorkLoopResponse);
  rpc StopWorkLoop(StopWorkLoopRequest) returns (StopWorkLoopResponse);
  rpc GetWorkLoop(GetWorkLoopRequest) returns (GetWorkLoopResponse);

  // Spawn a parallel workstream:
  // worktree+session, list them, preview/merge a branch back to base with the
  // conflict-aware review gate, or discard one. Subscribe(session_id) is reused
  // verbatim for per-workstream event streaming (the session_id rides inside
  // WorkstreamInfo).
  rpc SpawnWorkstream(SpawnWorkstreamRequest) returns (SpawnWorkstreamResponse);
  rpc ListWorkstreams(ListWorkstreamsRequest) returns (ListWorkstreamsResponse);
  rpc PreviewMerge(PreviewMergeRequest) returns (PreviewMergeResponse);
  rpc MergeWorkstream(MergeWorkstreamRequest) returns (MergeWorkstreamResponse);
  rpc DiscardWorkstream(DiscardWorkstreamRequest) returns (DiscardWorkstreamResponse);
  rpc RetryIntegration(RetryIntegrationRequest) returns (RetryIntegrationResponse);
}
