name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: true
      - name: Check formatting
        run: test -z "$(git ls-files '*.go' | xargs gofmt -l)"
      - name: Vet
        run: go vet ./...
      - name: Test (uncached)
        run: go test -count=1 ./...
      - name: Require the PTY end-to-end suite to execute
        shell: bash
        run: |
          set -o pipefail
          output="$(mktemp)"
          go test -count=1 -v ./internal/e2e | tee "$output"
          if grep -q -- '--- SKIP:' "$output"; then
            echo "The PTY end-to-end suite skipped a test" >&2
            exit 1
          fi
          grep -q -- '--- PASS: TestE2E' "$output"
      - name: Check design references
        run: go run ./cmd/ycc spec-check

  race:
    name: Go race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: true
      - name: Test with race detector
        run: go test -race -count=1 ./...

  vulnerabilities:
    name: Go vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Scan reachable dependencies
        run: govulncheck ./...

  protobuf:
    name: Protobuf generated-code drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.8
          cache: true
      - name: Set up Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.71.0
      - name: Install pinned Go generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@v1.20.0
      - name: Regenerate protobuf clients
        run: |
          buf generate
          buf generate --template buf.gen.swift.yaml
      - name: Require committed Go and Swift output to be current
        shell: bash
        run: |
          git diff --exit-code -- proto/ycc/v1 clients/ios/YccKit/Sources/YccProto
          test -z "$(git status --porcelain -- proto/ycc/v1 clients/ios/YccKit/Sources/YccProto)"

  swift:
    name: Swift package and iOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: '16.4'
      - name: Cache Swift packages and build products
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            clients/ios/YccKit/.build
          key: swift-${{ runner.os }}-xcode-16.4-${{ hashFiles('clients/ios/YccKit/Package.swift') }}
      - name: Test YccKit
        run: swift test --package-path clients/ios/YccKit
      - name: Install XcodeGen 2.44.1
        shell: bash
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --silent --show-error \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip \
            --output "$archive"
          echo "a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  $archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate and build the iOS app
        shell: bash
        run: |
          cd clients/ios
          xcodegen generate
          xcodebuild \
            -project Ycc.xcodeproj \
            -scheme Ycc \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/YccDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build
